#
# Boot Shim Configs
#
[boot_shim]
requires_kernel_header = true

#
# UEFI FD Configs
#
[uefi_fd]
base = 0x9FC00000
size = 0x300000

#
# Android Boot Image Kernel Configs
#
[boot_image_kernel]
kernel_compression = "gzip"
append_dtb         = true

#
# Android Boot Image Configs
#
[boot_image]
header_version = 1
# The mkbootimg defaults this board's image has always been packed with,
# written out because the UniXNU driver applies its own defaults otherwise.
base = 0x10000000
kernel_offset = 0x00008000
tags_offset = 0x00000100
pagesize = 2048
